<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會議簽到試用</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2433; --muted: #6b7385;
    --line: #d9dce3; --accent: #1f6feb; --accent-ink: #fff; --danger: #c62828; --ok: #1b7f3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
  header { margin-bottom: 0; }
  main > * { min-width: 0; }
  header { margin-bottom: 16px; }
  .eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.35; }
  .card { background: var(--card); border-radius: 14px; padding: 18px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  label { display: block; font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .req { color: var(--danger); margin-left: 2px; }
  .opt { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 4px; }
  input[type=text] { width: 100%; font-size: 17px; padding: 12px; border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 14px; background: #fff; color: var(--ink); }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .sig-head { display: flex; justify-content: space-between; align-items: baseline; }
  .sig-wrap { position: relative; border: 2px dashed var(--line); border-radius: 12px; background: #fff;
    height: 220px; touch-action: none; overflow: hidden; }
  .sig-wrap.has-ink { border-style: solid; border-color: #b9c3d6; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #a3a9b6; font-size: 18px; pointer-events: none; }
  .sig-wrap.has-ink .placeholder { display: none; }
  .baseline { position: absolute; left: 16px; right: 16px; bottom: 50px; border-bottom: 1px solid #e6e8ee; pointer-events: none; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  button { font-size: 17px; font-weight: 600; border-radius: 10px; padding: 14px; border: 0; cursor: pointer; }
  .btn-clear { background: #eceef2; color: var(--ink); flex: 0 0 34%; }
  .btn-submit { background: var(--accent); color: var(--accent-ink); flex: 1; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 12px; font-size: 15px; min-height: 1.4em; }
  .msg.err { color: var(--danger); }
  .done { text-align: center; padding: 36px 16px; }
  .done .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff;
    font-size: 36px; line-height: 64px; margin: 0 auto 14px; }
  .done h2 { margin: 0 0 6px; font-size: 22px; }
  .done p { margin: 4px 0; color: var(--muted); }
  .link-btn { background: none; color: var(--accent); font-size: 15px; margin-top: 18px; padding: 8px; }
  .hidden { display: none; }

  .note { background: #fff6dc; color: #6b4e00; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
  .preview { display: block; margin: 14px auto 0; max-width: 100%; max-height: 120px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .roster h2 { font-size: 18px; margin: 0; }
  .roster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .count { color: var(--muted); font-size: 14px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 420px; }
  th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { background: #eef2f7; font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.time { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); font-size: 13px; }
  td img { height: 40px; max-width: 140px; object-fit: contain; display: block; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; }
  .btn-excel { background: #1d6f42; color: #fff; flex: 1; }
  .btn-reset { background: #eceef2; color: var(--ink); flex: 0 0 38%; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 10px 0 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">電子簽到</p>
    <h1 id="meetingTitle">11月校務會議（試用）</h1>
  </header>

  <section class="card" id="formCard">
    <div class="note">這是試用版：可以試手寫簽名、看名冊、下載含簽名的 Excel。資料只存在這支手機，<b>不會上傳</b>，也不會存到 Google 雲端硬碟。</div>
    <label for="name">姓名<span class="req">*</span></label>
    <input type="text" id="name" autocomplete="name" maxlength="50">

    <label for="org">單位<span class="opt">（選填）</span></label>
    <input type="text" id="org" autocomplete="organization" maxlength="100">

    <label for="title">職稱<span class="opt">（選填）</span></label>
    <input type="text" id="title" autocomplete="organization-title" maxlength="50">

    <div class="sig-head">
      <label>請在下方框內簽名<span class="req">*</span></label>
    </div>
    <div class="sig-wrap" id="sigWrap">
      <div class="baseline"></div>
      <div class="placeholder">用手指在這裡簽名</div>
      <canvas id="pad"></canvas>
    </div>

    <div class="row">
      <button type="button" class="btn-clear" id="clearBtn">重簽</button>
      <button type="button" class="btn-submit" id="submitBtn">送出簽到</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section class="card done hidden" id="doneCard">
    <div class="check">✓</div>
    <h2>簽到完成</h2>
    <p id="doneName"></p>
    <p id="doneTime"></p>
    <img class="preview" id="preview" alt="剛剛的簽名">
    <button type="button" class="link-btn" id="againBtn">幫下一位簽到</button>
  </section>

  <section class="card roster" id="roster">
    <div class="roster-head">
      <h2>簽到名冊</h2>
      <span class="count" id="count">0 人</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>序號</th><th>簽到時間</th><th>姓名</th><th>單位</th><th>簽名</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="row">
      <button type="button" class="btn-reset" id="resetBtn">清除試用資料</button>
      <button type="button" class="btn-excel" id="excelBtn">下載 Excel 簽到表</button>
    </div>
    <div class="msg" id="rosterMsg" role="status"></div>
    <p class="hint">正式版會把這份名冊寫進你的 Google 試算表，簽名直接顯示在儲存格裡，並可一鍵匯出含簽名的 Excel 與 PDF 簽到表。</p>
  </section>
</main>
<script>
  // ===== 試用版：資料只存在這支手機（不上傳） =====
  const KEY = 'meeting-signin-demo';
  let records = [];
  try { records = JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { records = []; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(records)); } catch (e) {} }
  function nowText() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return d.getFullYear() + '/' + z(d.getMonth() + 1) + '/' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
  }
  function renderRoster() {
    const tb = document.getElementById('rows');
    tb.textContent = '';
    document.getElementById('count').textContent = records.length + ' 人';
    if (!records.length) {
      const tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 5; td.className = 'empty'; td.textContent = '還沒有人簽到。在上面簽一次，名冊就會出現在這裡。';
      tr.appendChild(td); tb.appendChild(tr); return;
    }
    records.forEach((r, i) => {
      const tr = document.createElement('tr');
      const cell = (text, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = text; tr.appendChild(td); };
      cell(i + 1, 'num'); cell(r.time.slice(11), 'time'); cell(r.name); cell(r.org || '—');
      const td = document.createElement('td'), img = document.createElement('img');
      img.src = r.sig; img.alt = r.name + ' 的簽名'; td.appendChild(img); tr.appendChild(td);
      tb.appendChild(tr);
    });
  }
  window.google = { script: { run: (function () {
    const r = { _ok: null, _fail: null,
      withSuccessHandler(f) { r._ok = f; return r; },
      withFailureHandler(f) { r._fail = f; return r; },
      submitSignIn(p) {
        const img = new Image();
        img.onload = () => {
          const rec = { time: nowText(), name: p.name, org: p.org, title: p.title, sig: p.signature, w: img.naturalWidth, h: img.naturalHeight };
          records.push(rec); save(); renderRoster();
          document.getElementById('preview').src = p.signature;
          setTimeout(() => r._ok({ no: records.length, time: rec.time }), 400);
        };
        img.onerror = () => r._fail && r._fail(new Error('簽名圖讀取失敗'));
        img.src = p.signature;
      } };
    return r; })() } };

  document.getElementById('resetBtn').onclick = function () {
    if (this.dataset.armed) {
      records = []; save(); renderRoster(); delete this.dataset.armed; this.textContent = '清除試用資料';
    } else {
      this.dataset.armed = '1'; this.textContent = '再按一次確認清除';
      setTimeout(() => { delete this.dataset.armed; this.textContent = '清除試用資料'; }, 3000);
    }
  };

  document.getElementById('excelBtn').onclick = async function () {
    const m = document.getElementById('rosterMsg');
    m.className = 'msg'; m.textContent = '';
    if (!records.length) { m.className = 'msg err'; m.textContent = '還沒有簽到資料，請先簽一次。'; return; }
    if (!window.ExcelJS) { m.className = 'msg err'; m.textContent = 'Excel 元件載入失敗，請確認網路後重新整理。'; return; }
    const meeting = document.getElementById('meetingTitle').textContent;
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('簽到表', { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    ws.columns = [{ width: 6 }, { width: 20 }, { width: 12 }, { width: 18 }, { width: 12 }, { width: 30 }];
    ws.mergeCells('A1:F1'); ws.mergeCells('A2:F2');
    ws.getCell('A1').value = meeting + '　簽到表';
    ws.getCell('A1').font = { size: 16, bold: true };
    ws.getCell('A2').value = '簽到人數：' + records.length + ' 人　　匯出時間：' + nowText().slice(0, 16);
    ws.getCell('A2').font = { color: { argb: 'FF555555' } };
    ['A1', 'A2'].forEach(a => ws.getCell(a).alignment = { horizontal: 'center' });
    const head = ws.getRow(4);
    head.values = ['序號', '簽到時間', '姓名', '單位', '職稱', '簽名'];
    head.font = { bold: true };
    const border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
    head.eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF2F7' } }; c.border = border; c.alignment = { horizontal: 'center' }; });
    records.forEach((r, i) => {
      const row = ws.getRow(5 + i);
      row.values = [i + 1, r.time, r.name, r.org, r.title, ''];
      row.height = 48;
      for (let c = 1; c <= 6; c++) { const cell = row.getCell(c); cell.border = border; cell.alignment = { vertical: 'middle', horizontal: c === 1 ? 'center' : 'left', wrapText: true }; }
      const k = Math.min(190 / (r.w || 190), 48 / (r.h || 48), 1);
      const id = wb.addImage({ base64: r.sig, extension: 'png' });
      ws.addImage(id, { tl: { col: 5.05, row: 4 + i + 0.15 }, ext: { width: Math.round((r.w || 200) * k), height: Math.round((r.h || 56) * k) }, editAs: 'oneCell' });
    });
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '簽到表_' + meeting.replace(/[\\/:*?"<>|（）()\s]+/g, '') + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    m.textContent = '已產生 Excel 簽到表（' + records.length + ' 人）。';
  };

  renderRoster();

(function () {
  const meeting = document.getElementById('meetingTitle').textContent;
  const wrap = document.getElementById('sigWrap');
  const canvas = document.getElementById('pad');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  let strokes = [];      // 保存筆跡，方便螢幕旋轉時重畫
  let current = null;

  function resize() {
    const r = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function style() {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; ctx.lineWidth = 2.6;
  }

  function drawStroke(s) {
    style();
    if (s.length === 1) { ctx.beginPath(); ctx.arc(s[0].x, s[0].y, 1.4, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
    for (let i = 1; i < s.length - 1; i++) {
      const mx = (s[i].x + s[i + 1].x) / 2, my = (s[i].y + s[i + 1].y) / 2;
      ctx.quadraticCurveTo(s[i].x, s[i].y, mx, my);
    }
    const last = s[s.length - 1]; ctx.lineTo(last.x, last.y); ctx.stroke();
  }

  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(drawStroke);
    wrap.classList.toggle('has-ink', strokes.length > 0);
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    current = [pos(e)]; strokes.push(current); redraw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    e.preventDefault();
    let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (!evs || !evs.length) evs = [e];
    evs.forEach(ev => current.push(pos(ev)));
    redraw();
  });
  const end = () => { current = null; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  // 防止 iOS 在簽名框內捲動頁面
  wrap.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  window.addEventListener('resize', resize);
  resize();

  function clearPad() { strokes = []; redraw(); }
  document.getElementById('clearBtn').onclick = clearPad;

  function inkLength() {
    let n = 0;
    strokes.forEach(s => { for (let i = 1; i < s.length; i++) n += Math.hypot(s[i].x - s[i-1].x, s[i].y - s[i-1].y); });
    return n;
  }

  // 輸出白底 PNG，並裁掉多餘空白
  function exportPng() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    strokes.forEach(s => s.forEach(p => {
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    }));
    const pad = 16, scale = 2;
    const w = Math.max(maxX - minX, 1) + pad * 2, h = Math.max(maxY - minY, 1) + pad * 2;
    const out = document.createElement('canvas');
    out.width = Math.round(w * scale); out.height = Math.round(h * scale);
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
    o.setTransform(scale, 0, 0, scale, (pad - minX) * scale, (pad - minY) * scale);
    strokes.forEach(s => {
      o.lineCap = 'round'; o.lineJoin = 'round'; o.strokeStyle = '#111'; o.fillStyle = '#111'; o.lineWidth = 2.6;
      if (s.length === 1) { o.beginPath(); o.arc(s[0].x, s[0].y, 1.4, 0, Math.PI * 2); o.fill(); return; }
      o.beginPath(); o.moveTo(s[0].x, s[0].y);
      for (let i = 1; i < s.length - 1; i++) {
        o.quadraticCurveTo(s[i].x, s[i].y, (s[i].x + s[i+1].x) / 2, (s[i].y + s[i+1].y) / 2);
      }
      o.lineTo(s[s.length-1].x, s[s.length-1].y); o.stroke();
    });
    return out.toDataURL('image/png');
  }

  function showErr(t) { msg.textContent = t; msg.className = 'msg err'; }

  submitBtn.onclick = function () {
    const name = document.getElementById('name').value.trim();
    if (!name) { showErr('請填寫姓名'); document.getElementById('name').focus(); return; }
    if (inkLength() < 30) { showErr('請先在框內簽名'); return; }

    submitBtn.disabled = true; submitBtn.textContent = '上傳中…';
    msg.textContent = ''; msg.className = 'msg';

    const payload = {
      meeting: meeting,
      name: name,
      org: document.getElementById('org').value.trim(),
      title: document.getElementById('title').value.trim(),
      signature: exportPng()
    };

    google.script.run
      .withSuccessHandler(res => {
        document.getElementById('doneName').textContent = name + '，謝謝您';
        document.getElementById('doneTime').textContent = '簽到時間：' + res.time;
        document.getElementById('formCard').classList.add('hidden');
        document.getElementById('doneCard').classList.remove('hidden');
        submitBtn.disabled = false; submitBtn.textContent = '送出簽到';
      })
      .withFailureHandler(err => {
        showErr('送出失敗：' + (err && err.message ? err.message : '請稍後再試'));
        submitBtn.disabled = false; submitBtn.textContent = '送出簽到';
      })
      .submitSignIn(payload);
  };

  document.getElementById('againBtn').onclick = function () {
    ['name', 'org', 'title'].forEach(id => document.getElementById(id).value = '');
    clearPad();
    document.getElementById('doneCard').classList.add('hidden');
    document.getElementById('formCard').classList.remove('hidden');
    resize();
  };
})();
</script>
</body>
</html>
